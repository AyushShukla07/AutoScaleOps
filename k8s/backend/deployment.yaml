apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaleops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaleops-backend
  template:
    metadata:
      labels:
        app: autoscaleops-backend
    spec:
      containers:
        - name: backend
          image: ayushshukla07/autoscaleops-backend:latest
          ports:
            - containerPort: 5000
